<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>marceaub.lat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="site-shell">
    <header>
      <a class="brand" href="/">
        <img class="brand-logo" src="images/logo.svg" alt="logo">
        <div class="brand-copy">
          <strong>marceaub.lat</strong>
          <span>Personal Server Hub</span>
        </div>
      </a>
      <nav>
        <a href="#status">Status</a>
        <a href="#gallery">Gallery</a>
        <a href="#interfaces">Links</a>
      </nav>
    </header>

    <main>
      <section class="hero" id="status">
        <h1>Control & monitoring for server.marceaub.lat</h1>
        <div class="hero-panels">
          <article class="panel status-panel">
            <div class="panel-head">
              <span>Home Server</span>
              <strong id="server-status">...</strong>
            </div>
            <p id="status-detail">Checking connection...</p>
          </article>
          <article class="panel grafana-panel">
            <div class="panel-head">
              <span>Grafana Health</span>
              <strong id="grafana-status">...</strong>
            </div>
            <p id="grafana-detail">Port 3000 monitoring.</p>
          </article>
        </div>
      </section>

      <section class="section" id="gallery">
        <div class="section-heading">
          <h2>Gallery</h2>
        </div>
        <div class="grid gallery-grid" id="gallery-grid"></div>
      </section>

      <section class="section" id="interfaces">
        <div class="section-heading">
          <h2>Interfaces</h2>
        </div>
        <div class="grid link-grid" id="link-grid"></div>
      </section>
    </main>

    <footer>
      &copy; 2026 marceaub.lat &bull; IPv6 Operations
    </footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
